name: snake
on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: snake
  cancel-in-progress: true
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=%23FAFAFA&color_dots=%23141414,%23262626,%238A8A8A,%23FAFAFA,%23FAFAFA
            dist/snake-light.svg?palette=github-light&color_snake=%230A0A0A&color_dots=%23F0F0F0,%23D4D4D4,%235C5C5C,%230A0A0A,%230A0A0A
      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
