<svg xmlns="http://www.w3.org/2000/svg" width="880" height="200" viewBox="0 0 880 200" role="img" aria-label="Me parler : quelqu'un qui ne lâche jamais rien, tout en restant à l'écoute.">
  <rect width="880" height="200" fill="#0A0A0A"/>
  <rect x="0.5" y="0.5" width="879" height="199" fill="none" stroke="#262626"/>
  <text x="40" y="46" font-family="monospace" font-size="11" letter-spacing="4" fill="#8A8A8A">ME PARLER</text>
  <text x="40" y="96" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800" fill="#FAFAFA">« Quelqu'un qui ne lâche jamais rien,</text>
  <text x="40" y="128" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800" fill="#FAFAFA">tout en restant à l'écoute. »</text>
  <text x="40" y="168" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#8A8A8A">C'est comme ça qu'on me décrit. Une idée, un projet, une envie de créer ? C'est exactement ce que j'aime.</text>
</svg>
