<svg xmlns="http://www.w3.org/2000/svg" width="880" height="170" viewBox="0 0 880 170" role="img" aria-label="De A à Z : idée, charte, architecture, build, déploiement.">
  <rect width="880" height="170" fill="#FAFAFA"/>
  <rect x="0.5" y="0.5" width="879" height="169" fill="none" stroke="#D4D4D4"/>
  <text x="40" y="40" font-family="monospace" font-size="11" letter-spacing="4" fill="#5C5C5C">DE A À Z</text>
  <rect x="40.5" y="66.5" width="131" height="44" fill="none" stroke="#D4D4D4"/>
  <text x="106" y="93" text-anchor="middle" font-family="monospace" font-size="12" fill="#0A0A0A">IDÉE</text>
  <rect x="202.5" y="66.5" width="131" height="44" fill="none" stroke="#D4D4D4"/>
  <text x="268" y="93" text-anchor="middle" font-family="monospace" font-size="12" fill="#0A0A0A">CHARTE</text>
  <rect x="364.5" y="66.5" width="131" height="44" fill="none" stroke="#D4D4D4"/>
  <text x="430" y="93" text-anchor="middle" font-family="monospace" font-size="12" fill="#0A0A0A">ARCHITECTURE</text>
  <rect x="526.5" y="66.5" width="131" height="44" fill="none" stroke="#D4D4D4"/>
  <text x="592" y="93" text-anchor="middle" font-family="monospace" font-size="12" fill="#0A0A0A">BUILD</text>
  <rect x="688.5" y="66.5" width="131" height="44" fill="none" stroke="#D4D4D4"/>
  <text x="754" y="93" text-anchor="middle" font-family="monospace" font-size="12" fill="#0A0A0A">DÉPLOIEMENT</text>
  <text x="187" y="93" text-anchor="middle" font-family="monospace" font-size="14" fill="#5C5C5C">→</text>
  <text x="349" y="93" text-anchor="middle" font-family="monospace" font-size="14" fill="#5C5C5C">→</text>
  <text x="511" y="93" text-anchor="middle" font-family="monospace" font-size="14" fill="#5C5C5C">→</text>
  <text x="673" y="93" text-anchor="middle" font-family="monospace" font-size="14" fill="#5C5C5C">→</text>
  <text x="40" y="150" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5C5C5C">Tout, seul, de bout en bout — de la première idée au déploiement.</text>
</svg>
