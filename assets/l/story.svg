<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240" role="img" aria-label="Mon histoire : passionné depuis mes 2 ans.">
  <rect width="880" height="240" fill="#FAFAFA"/>
  <rect x="0.5" y="0.5" width="879" height="239" fill="none" stroke="#D4D4D4"/>
  <text x="40" y="46" font-family="monospace" font-size="11" letter-spacing="4" fill="#5C5C5C">MON HISTOIRE</text>
  <text x="840" y="46" text-anchor="end" font-family="monospace" font-size="11" fill="#5C5C5C">DEPUIS MES 2 ANS</text>
  <text x="40" y="94" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800" fill="#0A0A0A">Je parle pas. J'agis.</text>
  <text x="40" y="130" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0A0A0A">Passionné d'informatique depuis mes 2 ans : devant la télé, je voulais comprendre</text>
  <text x="40" y="152" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0A0A0A">pourquoi le Mickey que je regardais vivait aussi dans un jeu que je contrôlais.</text>
  <text x="40" y="182" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5C5C5C">Ma flemme est devenue passion : automatiser, simplifier, faire tourner les choses seules.</text>
  <text x="40" y="204" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5C5C5C">Je prends ce qui coince, j'en fais un outil qui travaille à ma place. Et à la vôtre.</text>
</svg>
