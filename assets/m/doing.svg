<svg xmlns="http://www.w3.org/2000/svg" width="360" height="480" viewBox="0 0 360 480" role="img" aria-label="Ce que je fais : je construis, j'audite, je co-fonde.">
  <rect width="360" height="480" fill="#0A0A0A"/>
  <rect x="0.5" y="0.5" width="359" height="479" fill="none" stroke="#262626"/>
  <text x="20" y="40" font-family="monospace" font-size="10" letter-spacing="3" fill="#8A8A8A">CE QUE JE FAIS</text>
  <text x="340" y="40" text-anchor="end" font-family="monospace" font-size="10" fill="#8A8A8A">TROIS GESTES</text>
  <text x="20" y="68" font-family="monospace" font-size="10" letter-spacing="3" fill="#8A8A8A">01</text>
  <text x="20" y="98" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#FAFAFA">Je construis</text>
  <text x="20" y="119" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#8A8A8A">Des IA sur mesure et du code qui rend du temps</text>
  <text x="20" y="138" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#8A8A8A">aux gens. Seul, de bout en bout.</text>
  <line x1="20" y1="158.5" x2="340" y2="158.5" stroke="#262626"/>
  <text x="20" y="186" font-family="monospace" font-size="10" letter-spacing="3" fill="#8A8A8A">02</text>
  <text x="20" y="216" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#FAFAFA">J'audite</text>
  <text x="20" y="237" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#8A8A8A">Des architectures IA pour d'autres. Challenger</text>
  <text x="20" y="256" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#8A8A8A">un système vaut autant que le bâtir.</text>
  <line x1="20" y1="276.5" x2="340" y2="276.5" stroke="#262626"/>
  <text x="20" y="304" font-family="monospace" font-size="10" letter-spacing="3" fill="#8A8A8A">03</text>
  <text x="20" y="334" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#FAFAFA">Je co-fonde</text>
  <text x="20" y="355" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#8A8A8A">ParleCitoyen, une plateforme citoyenne, pour</text>
  <text x="20" y="374" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#8A8A8A">que ce que je code serve au-delà de moi.</text>
  <line x1="20" y1="394.5" x2="340" y2="394.5" stroke="#262626"/>
  <text x="20" y="420" font-family="monospace" font-size="10" letter-spacing="3" fill="#FAFAFA">DE A À Z</text>
  <text x="20" y="438" font-family="monospace" font-size="10" letter-spacing="3" fill="#FAFAFA">BUILDER &amp; CONSULTANT</text>
  <text x="20" y="456" font-family="monospace" font-size="10" letter-spacing="3" fill="#FAFAFA">RIEN N'EST IMPOSSIBLE</text>
</svg>
