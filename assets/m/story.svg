<svg xmlns="http://www.w3.org/2000/svg" width="360" height="288" viewBox="0 0 360 288" role="img" aria-label="Mon histoire : passionné depuis mes 2 ans.">
  <rect width="360" height="288" fill="#0A0A0A"/>
  <rect x="0.5" y="0.5" width="359" height="287" fill="none" stroke="#262626"/>
  <text x="20" y="40" font-family="monospace" font-size="10" letter-spacing="3" fill="#8A8A8A">MON HISTOIRE</text>
  <text x="340" y="40" text-anchor="end" font-family="monospace" font-size="10" fill="#8A8A8A">DEPUIS MES 2 ANS</text>
  <text x="20" y="82" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#FAFAFA">Je parle pas. J'agis.</text>
  <text x="20" y="108" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#FAFAFA">Passionné d'informatique depuis mes 2 ans :</text>
  <text x="20" y="128" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#FAFAFA">devant la télé, je voulais comprendre pourquoi</text>
  <text x="20" y="148" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#FAFAFA">le Mickey que je regardais vivait aussi dans</text>
  <text x="20" y="168" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#FAFAFA">un jeu que je contrôlais.</text>
  <text x="20" y="196" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#8A8A8A">Ma flemme est devenue passion : automatiser,</text>
  <text x="20" y="216" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#8A8A8A">simplifier, faire tourner les choses seules.</text>
  <text x="20" y="244" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#8A8A8A">Je prends ce qui coince, j'en fais un outil</text>
  <text x="20" y="264" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#8A8A8A">qui travaille à ma place. Et à la vôtre.</text>
</svg>
