<svg xmlns="http://www.w3.org/2000/svg" width="360" height="229" viewBox="0 0 360 229" role="img" aria-label="Me parler : quelqu'un qui ne lâche jamais rien, tout en restant à l'écoute.">
  <rect width="360" height="229" fill="#0A0A0A"/>
  <rect x="0.5" y="0.5" width="359" height="228" fill="none" stroke="#262626"/>
  <text x="20" y="40" font-family="monospace" font-size="10" letter-spacing="3" fill="#8A8A8A">ME PARLER</text>
  <text x="20" y="80" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#FAFAFA">« Quelqu'un qui ne lâche</text>
  <text x="20" y="110" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#FAFAFA">jamais rien, tout en</text>
  <text x="20" y="140" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#FAFAFA">restant à l'écoute. »</text>
  <text x="20" y="167" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#8A8A8A">C'est comme ça qu'on me décrit. Une idée, un</text>
  <text x="20" y="186" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#8A8A8A">projet, une envie de créer ? C'est exactement</text>
  <text x="20" y="205" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#8A8A8A">ce que j'aime.</text>
</svg>
