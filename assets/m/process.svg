<svg xmlns="http://www.w3.org/2000/svg" width="360" height="430" viewBox="0 0 360 430" role="img" aria-label="De A à Z : idée, charte, architecture, build, déploiement.">
  <rect width="360" height="430" fill="#0A0A0A"/>
  <rect x="0.5" y="0.5" width="359" height="429" fill="none" stroke="#262626"/>
  <text x="20" y="40" font-family="monospace" font-size="10" letter-spacing="3" fill="#8A8A8A">DE A À Z</text>
  <rect x="20.5" y="60.5" width="319" height="39" fill="none" stroke="#262626"/>
  <text x="180" y="84" text-anchor="middle" font-family="monospace" font-size="12" fill="#FAFAFA">IDÉE</text>
  <text x="180" y="117" text-anchor="middle" font-family="monospace" font-size="14" fill="#8A8A8A">↓</text>
  <rect x="20.5" y="124.5" width="319" height="39" fill="none" stroke="#262626"/>
  <text x="180" y="148" text-anchor="middle" font-family="monospace" font-size="12" fill="#FAFAFA">CHARTE</text>
  <text x="180" y="181" text-anchor="middle" font-family="monospace" font-size="14" fill="#8A8A8A">↓</text>
  <rect x="20.5" y="188.5" width="319" height="39" fill="none" stroke="#262626"/>
  <text x="180" y="212" text-anchor="middle" font-family="monospace" font-size="12" fill="#FAFAFA">ARCHITECTURE</text>
  <text x="180" y="245" text-anchor="middle" font-family="monospace" font-size="14" fill="#8A8A8A">↓</text>
  <rect x="20.5" y="252.5" width="319" height="39" fill="none" stroke="#262626"/>
  <text x="180" y="276" text-anchor="middle" font-family="monospace" font-size="12" fill="#FAFAFA">BUILD</text>
  <text x="180" y="309" text-anchor="middle" font-family="monospace" font-size="14" fill="#8A8A8A">↓</text>
  <rect x="20.5" y="316.5" width="319" height="39" fill="none" stroke="#262626"/>
  <text x="180" y="340" text-anchor="middle" font-family="monospace" font-size="12" fill="#FAFAFA">DÉPLOIEMENT</text>
  <text x="20" y="387" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#8A8A8A">Tout, seul, de bout en bout — de la première</text>
  <text x="20" y="406" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#8A8A8A">idée au déploiement.</text>
</svg>
